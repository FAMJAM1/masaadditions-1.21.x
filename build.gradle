plugins {
    id 'dev.architectury.loom' version '1.9-SNAPSHOT'
    id 'maven-publish'
}

String mod_version = "${mod_base_version}+${mod_version_meta}"

base {
    archivesName = project.archives_base_name
    version = mod_version
    group = project.maven_group
}

loom {
    accessWidenerPath = file("src/main/resources/masaadditions.aw")
    neoForge {}
}

repositories {
    maven { url = "https://maven.neoforged.net/releases" }
    maven { url = "https://maven.fabricmc.net/" }
    maven { url = "https://maven.architectury.dev/" }
    maven { url = 'https://api.modrinth.com/maven' }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.layered {
        mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
        mappings "dev.architectury:yarn-mappings-patch-neoforge:${project.yarn_mappings_patch}"
    }
    neoForge "net.neoforged:neoforge:${project.neoforge_version}"

    modImplementation "maven.modrinth:mafglib:${project.mafglib_version}"
    modImplementation "maven.modrinth:forgematica:${project.forgematica_version}"
    modImplementation "maven.modrinth:tweakerge:${project.tweakerge_version}"
    modImplementation "maven.modrinth:bocchud:${project.bocchud_version}"
}

processResources {
    inputs.property "version", project.version
    filesMatching("META-INF/neoforge.mods.toml") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = 21
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    withSourcesJar()
}

jar {
    from "LICENSE"
    manifest {
        attributes([
            "MixinConfigs": "masaadditions.tweakeroo_additions.tweakeroo_mixin.json,masaadditions.tweakeroo_additions.mixin.json,masaadditions.minihud_additions.minihud_mixin.json,masaadditions.minihud_additions.mixin.json,masaadditions.litematica_additions.litematica_mixin.json,masaadditions.litematica_additions.mixin.json"
        ])
    }
}
